<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <rect width="600" height="480" fill="#c4b8aa"/>
  <rect x="1" y="1" width="598" height="478" stroke="#171411" stroke-opacity="0.25" stroke-width="0.5"/>
  <rect x="8" y="8" width="584" height="464" stroke="#171411" stroke-opacity="0.15" stroke-width="0.5"/>
  <!-- Grid de 4 células simulando collage editorial -->
  <rect x="20" y="20" width="270" height="215" fill="#302b26" fill-opacity="0.08" stroke="#302b26" stroke-opacity="0.2" stroke-width="0.7"/>
  <rect x="310" y="20" width="270" height="215" fill="#302b26" fill-opacity="0.06" stroke="#302b26" stroke-opacity="0.2" stroke-width="0.7"/>
  <rect x="20" y="248" width="270" height="215" fill="#302b26" fill-opacity="0.06" stroke="#302b26" stroke-opacity="0.2" stroke-width="0.7"/>
  <rect x="310" y="248" width="270" height="215" fill="#302b26" fill-opacity="0.08" stroke="#302b26" stroke-opacity="0.2" stroke-width="0.7"/>
  <!-- Números -->
  <text x="30" y="36" font-family="monospace" font-size="7" fill="#8b4734" fill-opacity="0.7" letter-spacing="2">01</text>
  <text x="320" y="36" font-family="monospace" font-size="7" fill="#8b4734" fill-opacity="0.7" letter-spacing="2">02</text>
  <text x="30" y="264" font-family="monospace" font-size="7" fill="#8b4734" fill-opacity="0.7" letter-spacing="2">03</text>
  <text x="320" y="264" font-family="monospace" font-size="7" fill="#8b4734" fill-opacity="0.7" letter-spacing="2">04</text>
  <!-- Ícones de play centralizados em cada célula -->
  <polygon points="143,127 165,114 165,140" fill="#302b26" fill-opacity="0.2"/>
  <polygon points="433,127 455,114 455,140" fill="#302b26" fill-opacity="0.2"/>
  <polygon points="143,355 165,342 165,368" fill="#302b26" fill-opacity="0.2"/>
  <polygon points="433,355 455,342 455,368" fill="#302b26" fill-opacity="0.2"/>
  <!-- Label central -->
  <text x="300" y="460" font-family="serif" font-size="8" fill="#302b26" fill-opacity="0.5" text-anchor="middle" letter-spacing="3">SUBSTITUIR GALERIA · GRID MARKETING</text>
</svg>
